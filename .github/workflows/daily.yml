name: Daily AI Research Brief

on:
  schedule:
    - cron: "0 22 * * *" # 매일 UTC 22:00 = KST 07:00
  workflow_dispatch: {} # 수동 실행 버튼 (Actions 탭에서 Run workflow)

concurrency:
  group: daily-brief
  cancel-in-progress: false

permissions:
  contents: write   # reports/ 아카이브를 저장소에 커밋하기 위해 필요

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # 중복 제거 상태(data/seen.db)를 실행 간 유지.
      # 매 실행마다 새 키로 저장하고, restore-keys 접두사로 직전 캐시를 복원한다.
      # (Actions 러너는 실행마다 초기화되므로 이게 없으면 매일 전량이 "신규"가 됨)
      - name: Restore dedup state (seen.db)
        uses: actions/cache@v6
        with:
          path: data
          key: seen-db-${{ github.run_id }}
          restore-keys: |
            seen-db-

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync

      - name: Run brief
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
        run: uv run arip

      # 생성된 reports/ 를 저장소에 커밋 → GitHub이 .md를 렌더링하는 무료 웹 아카이브
      - name: Commit archived report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "커밋할 리포트 변경 없음."
          else
            git commit -m "Archive brief $(date -u +%Y-%m-%d)"
            git push
          fi
