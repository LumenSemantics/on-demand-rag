[project]
name = "airp"
version = "0.1.0"
description = "AIRP Stage 1 MVP — AI research crawl & notify"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Stage 2 — 지식 계층 (Qdrant Cloud + Neo4j Aura). 필요할 때만 설치:
#   uv sync --extra knowledge
knowledge = ["qdrant-client>=1.12", "neo4j>=5.14"]
# Stage 2/3 — GraphRAG 검색 API + 웹 UI (에이전트 포함):  uv sync --extra api
api = ["fastapi>=0.110", "uvicorn>=0.29", "qdrant-client>=1.12", "neo4j>=5.14", "langgraph>=0.2"]
# Stage 3 — LangGraph 리서치 에이전트:  uv sync --extra agent
agent = ["langgraph>=0.2", "qdrant-client>=1.12", "neo4j>=5.14"]

[project.scripts]
airp = "airp.main:main"
airp-kb = "airp.knowledge.cli:main"
airp-api = "airp.api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# 카테고리 규칙은 한 줄 정규식 테이블이라 줄길이 예외
"airp/catalog.py" = ["E501"]
# 임베디드 HTML 템플릿이 있어 줄길이 예외
"airp/api/app.py" = ["E501"]
