# Stage 1 MVP 수집 소스 설정
# 소스 추가는 대부분 여기에 URL 한 줄 넣는 것으로 끝납니다.
# (RSS URL은 2026-08 기준 실제 접속 확인된 것들)

# 브리핑 묶음 기준: category(AI 주제 카탈로그) 또는 source(소스별)
# classify: 카탈로그 분류 방식 — llm(LLM 키 필요, 정확) / keyword(무료, 규칙)
#           llm인데 키가 없으면 자동으로 keyword로 폴백
report:
  group_by: category
  classify: llm

# 볼륨 조절: 키워드 필터 + 소스별 상한 (제목+초록 기준, 대소문자 무시)
filter:
  include: []          # 예: [rag, agent, llm] → 이 중 하나라도 있어야 통과. 비면 전체 통과
  exclude: []          # 예: [robotics, diffusion] → 걸리면 제외
  max_per_source: 10   # 소스마다 최대 몇 건 표시할지 (0=제한 없음). HF는 upvotes 높은 순

arxiv:
  categories: [cs.AI, cs.CL, cs.LG, cs.IR]
  max_results: 30

huggingface:
  daily_papers: true
  limit: 30

rss:
  - name: HuggingFace Blog
    url: https://huggingface.co/blog/feed.xml
    limit: 8
  - name: OpenAI
    url: https://openai.com/news/rss.xml
    limit: 5
  - name: Google Research
    url: https://research.google/blog/rss/
    limit: 5
  - name: MIT Tech Review
    url: https://www.technologyreview.com/feed/
    limit: 8
  - name: The Decoder
    url: https://the-decoder.com/feed/
    limit: 8
  - name: Import AI
    url: https://importai.substack.com/feed
    limit: 5
  - name: The Sequence
    url: https://thesequence.substack.com/feed
    limit: 5
  # 한국어 AI·테크 뉴스 (2026-08 기준 접속 확인)
  - name: AI타임스
    url: https://www.aitimes.com/rss/allArticle.xml
    limit: 8
  - name: AI 투데이
    url: https://www.ai-today.kr/feed
    limit: 8
  # 블로터: AI 카테고리 피드가 없어 전체기사 피드를 받아 AI 키워드로만 걸러 씀.
  # include는 이 소스에만 적용됨(전역 filter와 별개). 필터가 수집 뒤 적용되므로
  # limit을 넉넉히 잡아 AI 기사가 충분히 남게 한다(최종 표시는 max_per_source가 제어).
  - name: 블로터
    url: https://cdn.bloter.net/rss/gns_allArticle.xml
    limit: 30
    include: [AI, 인공지능, LLM, GPT, 생성형, 챗봇, 머신러닝, 딥러닝, 오픈AI,
              제미나이, 클로드, 엔비디아, 반도체, 로봇, 자율주행]
